services:
  cloudflared:
    image: cloudflare/cloudflared:2025.1.0
    container_name: sub2api-cloudflared
    restart: unless-stopped
    command: tunnel run --metrics 0.0.0.0:2000
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
      - NO_AUTOUPDATE=true
    depends_on:
      sub2api:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2000/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
